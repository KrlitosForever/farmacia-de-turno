<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sin conexión · Farmacia de Turno</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --text: #1C1C1E;
      --subtext: #6E6E73;
      --accent: #0A84FF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1C1C1E;
        --text: #F5F5F7;
        --subtext: #98989D;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }

    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 40px 28px;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0A84FF, #00C7BE);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 8px;
    }

    p {
      color: var(--subtext);
      font-size: 15px;
      line-height: 1.4;
      margin: 0 0 24px;
    }

    button {
      appearance: none;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 13px 24px;
      border-radius: 14px;
      width: 100%;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Sin conexión a internet</h1>
    <p>No pudimos cargar Farmacia de Turno. Revisa tu conexión e inténtalo nuevamente.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>

</html>
