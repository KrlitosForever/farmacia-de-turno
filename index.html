<!DOCTYPE html>
<html lang="es">

<head>
  <!-- Etiquetas esenciales -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmacias de Turno</title>
  <meta name="description"
    content="Encuentra farmacias de turno cerca de ti en Chile. Selecciona tu localidad, visualiza en el mapa y obtén direcciones con un solo clic en Waze o Google Maps.">
  <!-- SEO Tags -->
  <meta name="keywords"
    content="farmacias de turno, farmacias Chile, farmacias cerca, farmacias de emergencia, Chile, Waze, Google Maps, farmacia local, Ministerio de Salud Chile">
  <meta name="author" content="Carlos Carrasco Varas">
  <meta name="robots" content="index, follow">
  <!-- Open Graph para mejorar la vista en redes sociales -->
  <meta property="og:title" content="Farmacia de Turno - Encuentra farmacias de turno cerca de ti">
  <meta property="og:description"
    content="Descubre rápidamente las farmacias de turno cercanas en tu localidad. Visualiza en el mapa y navega con un solo clic.">
  <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/4320/4320337.png">
  <meta property="og:url" content="https://farmacia-de-turno.clubinformatico.cl/">
  <meta property="og:type" content="website">
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Farmacia de Turno - Encuentra farmacias de turno cerca de ti">
  <meta name="twitter:description"
    content="Encuentra farmacias de turno en Chile fácilmente. Selecciona tu localidad y navega con Waze o Google Maps.">
  <meta name="twitter:image" content="https://cdn-icons-png.flaticon.com/512/4320/4320337.png">
  <!-- CSS de Bootstrap y Leaflet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .card {
      margin-bottom: 20px;
    }

    #map {
      margin-top: 20px;
      height: 500px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body class="bg-light">
  <div class="container">
    <h1 class="my-4 text-center text-primary">Farmacias de Turno</h1>
    <div class="row mb-3">
      <div class="col-md-4">
        <select id="comunaSelect" class="form-select">
          <option value="">Selecciona una comuna</option>
          <!-- Opciones de comunas se generan dinámicamente -->
        </select>
      </div>
    </div>
    <div class="row" id="pharmacyList">
      <!-- Tarjetas de farmacias generadas dinámicamente -->
    </div>
    <div id="map"></div>
  </div>

  <!-- Scripts de Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const apiUrl = "https://midas.minsal.cl/farmacia_v2/WS/getLocalesTurnos.php";
      let map;
      let markersGroup;
      let comunas = [];
      let pharmaciesData = [];
      let userLocation = null;

      // Fórmula de Haversine para calcular distancia en km entre dos coordenadas
      function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // Radio de la Tierra en km
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

      function initializeMap() {
        // Coordenadas por defecto (Centro de Santiago)
        map = L.map("map").setView([-33.4489, -70.6693], 12);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
        }).addTo(map);

        markersGroup = L.layerGroup().addTo(map);

        // Solicitar ubicación del usuario
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              userLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude
              };
              map.setView([userLocation.lat, userLocation.lng], 13);

              // Si ya cargaron los datos, forzamos un filtrado por cercanía
              if (pharmaciesData.length > 0) {
                loadPharmacies("", true);
                document.getElementById("comunaSelect").value = "";
              }
            },
            (error) => {
              console.warn('Geolocalización denegada o no disponible:', error);
            }
          );
        }
      }

      function populateComunas() {
        const comunaSelect = document.getElementById("comunaSelect");
        comunaSelect.innerHTML = '<option value="">Selecciona una comuna</option>';

        comunas = [...new Set(pharmaciesData.map((p) => p.comuna_nombre))].sort();

        const fragment = document.createDocumentFragment();
        comunas.forEach((comuna) => {
          const option = document.createElement('option');
          option.value = comuna;
          option.textContent = comuna;
          fragment.appendChild(option);
        });
        comunaSelect.appendChild(fragment);
      }

      function loadPharmacies(comuna = "", filterByLocation = false) {
        const pharmacyList = document.getElementById("pharmacyList");
        markersGroup.clearLayers();

        let filteredData = pharmaciesData;

        // Filtrar por comuna si se seleccionó una
        if (comuna) {
          filteredData = filteredData.filter(p => p.comuna_nombre === comuna);
        }
        // Si no hay comuna pero tenemos ubicación, filtramos las más cercanas (radio 15km)
        else if (filterByLocation && userLocation) {
          filteredData = filteredData.map(p => {
            p.distance = calculateDistance(userLocation.lat, userLocation.lng, p.local_lat, p.local_lng);
            return p;
          }).filter(p => p.distance <= 15) // Rango de 15 kilómetros
            .sort((a, b) => a.distance - b.distance); // Ordenar por cercanía
        }

        if (filteredData.length === 0) {
          pharmacyList.innerHTML = '<p class="text-center mt-3">No se encontraron farmacias con los criterios actuales.</p>';
          return;
        }

        let htmlCards = '';

        filteredData.forEach((pharmacy) => {
          // Prevenir errores si la API devuelve coordenadas vacías
          if (!pharmacy.local_lat || !pharmacy.local_lng) return;

          // Construcción del HTML usando Template Literals (más limpio y rápido)
          htmlCards += `
            <div class="col-md-4">
              <div class="card h-100 shadow-sm">
                <div class="card-body">
                  <h5 class="card-title text-primary">${pharmacy.local_nombre}</h5>
                  <p class="card-text mb-1"><strong>Comuna:</strong> ${pharmacy.comuna_nombre}</p>
                  <p class="card-text mb-1"><strong>Dirección:</strong> ${pharmacy.local_direccion}</p>
                  <p class="card-text mb-3"><strong>Horario:</strong> ${pharmacy.funcionamiento_hora_apertura} - ${pharmacy.funcionamiento_hora_cierre}</p>
                  
                  <div class="d-grid gap-2 d-md-block">
                    <a href="https://www.google.com/maps/search/?api=1&query=${pharmacy.local_lat},${pharmacy.local_lng}" target="_blank" class="btn btn-primary btn-sm">Ver en Google Maps</a>
                    <a href="https://www.waze.com/ul?ll=${pharmacy.local_lat},${pharmacy.local_lng}&navigate=yes" target="_blank" class="btn btn-secondary btn-sm">Abrir en Waze</a>
                  </div>
                </div>
              </div>
            </div>
          `;

          // Agregar marcador al mapa
          const marker = L.marker([pharmacy.local_lat, pharmacy.local_lng]);
          marker.bindPopup(`<b>${pharmacy.local_nombre}</b><br>${pharmacy.local_direccion}`);
          markersGroup.addLayer(marker);
        });

        // Inserción única en el DOM
        pharmacyList.innerHTML = htmlCards;

        // Ajustar la vista del mapa según los resultados
        if (comuna && filteredData.length > 0) {
          map.setView([filteredData[0].local_lat, filteredData[0].local_lng], 13);
        } else if (filterByLocation && userLocation) {
          // Se mantiene la vista en la ubicación del usuario si se filtró por GPS
          map.setView([userLocation.lat, userLocation.lng], 12);
        }
      }

      document.getElementById("comunaSelect").addEventListener("change", function () {
        const comuna = this.value;
        // Al seleccionar manualmente, desactivamos el filtro automático por GPS
        loadPharmacies(comuna, false);
      });

      initializeMap();

      // Carga inicial de datos
      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          pharmaciesData = data;
          populateComunas();

          // Render inicial: Si ya tenemos la ubicación cargada (rápida), filtramos. 
          // Si no, cargamos todo de momento.
          if (userLocation) {
            loadPharmacies("", true);
          } else {
            loadPharmacies();
          }
        })
        .catch(error => {
          console.error('Error al cargar los datos de MINSAL:', error);
          document.getElementById("pharmacyList").innerHTML = '<p class="text-center text-danger mt-3">Error al cargar los datos. Por favor, intenta nuevamente más tarde.</p>';
        });
    });
  </script>
</body>

</html>
